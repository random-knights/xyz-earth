# This repo carries an AiEDs disclosure block in its README, so it is a
# consumer of the org's reusable drift check. No credential: check only.
#
# The block states the energy of developing THIS repository. It is generated by
# the AiEDs README generator from the SessionEnd ledgers and placed here by the
# sync script in random-knights/.github. This check fails a block somebody has
# hand-edited, or one left stale after the generator ran.
name: AiEDs check

on:
  pull_request:
    paths:
      - README.md
      - .github/workflows/aieds-check.yml
  schedule:
    # Weekly backstop: this is what notices if the fan-out did not run at all.
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aieds:
    uses: random-knights/.github/.github/workflows/aieds.yml@main
    with:
      repo: xyz-earth
      readme: README.md
